---
layout: default
---
{%- comment -%} One theory or framework. `kind` and `nav` come from the collection defaults in _config.yml. {%- endcomment -%}
<article>
  <header class="post-head">
    <h1>{{ page.title }}</h1>
    <p class="byline">{{ page.kind | capitalize }}{% if page.date %} · {{ page.date | date: '%B %Y' }}{% endif %}</p>
  </header>
  <div class="prose">
{{ content }}
  </div>
  <nav class="pager mono" aria-label="{{ page.nav | capitalize }}">
    <a class="prev" href="{{ '/' | append: page.nav | append: '/' | relative_url }}">← All {{ page.nav }}</a>
  </nav>
</article>
