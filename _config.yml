title: Colby Schrauth
description: Thoughts, articles and a scrapbook from Colby Schrauth.
url: https://colbyschrauth.com
timezone: America/Los_Angeles

markdown: kramdown
plugins:
  - jekyll-feed

# New posts live at /blog/<slug>.html, alongside the older hand-written ones.
permalink: /blog/:title.html

collections:
  thoughts:
    output: false # notes only appear in the Notes section of the Writing page, not as their own pages
  projects:
    output: true # _projects/<name>.md -> /projects/<name>.html
    permalink: /projects/:name:output_ext
  playbooks:
    output: true # _playbooks/<playbook>/<chapter>.md -> /playbooks/<playbook>/<chapter>.html
    permalink: /playbooks/:path:output_ext
  frameworks:
    output: true # _frameworks/<name>.md -> /frameworks/<name>.html
    permalink: /frameworks/:name:output_ext
  theories:
    output: true # _theories/<name>.md -> /theories/<name>.html
    permalink: /theories/:name:output_ext

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      nav: projects
  - scope:
      path: ""
      type: playbooks
    values:
      layout: playbook
      nav: playbooks
  - scope:
      path: ""
      type: theories
    values:
      layout: entry
      nav: theories
      kind: theory
  - scope:
      path: ""
      type: frameworks
    values:
      layout: entry
      nav: frameworks
      kind: framework

feed:
  path: feed.xml

exclude:
  - README.md
  - STYLE.md
  - Gemfile
  - Gemfile.lock
  - bin
  - vendor
  - .DS_Store
