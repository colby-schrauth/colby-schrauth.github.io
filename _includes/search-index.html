{%- comment -%} Everything the ⌘K menu can jump to. {%- endcomment -%}
<script type="application/json" id="search-index">[
  {"title": "Home", "kind": "page", "url": {{ '/' | relative_url | jsonify }}},
  {"title": "Writing", "kind": "page", "url": {{ '/articles.html' | relative_url | jsonify }}},
  {"title": "Thoughts", "kind": "page", "url": {{ '/thoughts.html' | relative_url | jsonify }}},
  {"title": "Scrapbook", "kind": "page", "url": {{ '/scrapbook.html' | relative_url | jsonify }}},
  {"title": "About", "kind": "page", "url": {{ '/about.html' | relative_url | jsonify }}},
  {"title": "Favorite books", "kind": "list", "url": {{ '/lists/books.html' | relative_url | jsonify }}},
  {"title": "Favorite shows", "kind": "list", "url": {{ '/lists/shows.html' | relative_url | jsonify }}}
  {%- for post in site.posts %},
  {"title": {{ post.title | jsonify }}, "kind": {{ post.category | default: 'article' | downcase | jsonify }}, "url": {{ post.url | relative_url | jsonify }}}
  {%- endfor %}
  {%- for thought in site.thoughts %},
  {"title": {{ thought.title | jsonify }}, "kind": "thought", "url": {{ '/thoughts.html#' | append: thought.slug | relative_url | jsonify }}}
  {%- endfor %}
  {%- for category in site.data.articles %}{% for link in category.links %},
  {"title": {{ link.title | jsonify }}, "kind": {{ category.name | downcase | append: ' ↗' | jsonify }}, "url": {{ link.url | jsonify }}}
  {%- endfor %}{% endfor %}
]</script>
