---
layout: default
title: Thoughts
---
    <div class="thoughts-body">
      {% assign thoughts = site.thoughts | sort: "date" | reverse %}
      {% for thought in thoughts %}
      <h3>{{ thought.title }}<br><span class="thought-timestamp">{{ thought.date | date: "%B %-d, %Y" }}{% if thought.location %} - {{ thought.location }}{% endif %}</span></h3>
      {{ thought.content }}
      {% endfor %}
    </div>
