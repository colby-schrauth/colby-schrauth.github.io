---
layout: default
title: Articles
---
      {% for category in site.data.articles %}
        <h4 class="article-category">{{ category.name }}</h4>
        {% assign posts = site.posts | where: "category", category.name %}
        {% for post in posts %}
        <div class="article-link"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></div>
        {% endfor %}
        {% for link in category.links %}
        <div class="article-link"><a href="{{ link.url }}"{% if link.url contains "://" %} target="_blank"{% endif %}>{{ link.title }}</a></div>
        {% endfor %}
        <br>
      {% endfor %}
